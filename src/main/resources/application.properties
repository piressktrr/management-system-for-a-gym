## spring config import carrega o .env como fonte de config
## o optional faz a aplicaçao subir mesmo sem o arquivo
## o .properties diz para ler o arquivo no formato chave=valor

spring.config.import=optional:file:.env[.properties]
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.application.name=${POSTGRES_DATABASE}
spring.datasource.url=jdbc:postgresql://localhost:5432/${POSTGRES_DATABASE}
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=validate
spring.jackson.time-zone=America/Sao_Paulo

